function levels(h){const wv=h.wave??0,w=h.ws;return[["מתחיל",wv<0.9&&w<18],["בינוני",wv<1.6&&w<28],["מקצוען",wv<2.4&&w<38]]}
function gear(s,h){const wv=h.wave??0,O=(r,b,f)=>({r,b,f});
 if(s.t=="lake")return{o:[O("🪝 חכה פשוטה / פלוט 2.1–3 מ'","בצק, לחם, תולעים",["אמנון","קרפיון","בורי"]),O("🎯 ספינינג קל עם פיתיונות","סיליקון קטן, ספינר",["לברק","אמנון"]),O("🌙 תחתית כבדה (ערב/לילה)","כבד עוף, דג פיתיון",["שפמנון","קרפיון"])]};
 if(s.t=="red")return{o:[O("🎯 ספינינג/LRF 2.1–2.4 מ'","ג'יג קטן 10–30 גרם, פופר",["ברקודה גדולה","קרנגיים"]),O("🪝 חכה פשוטה קלה","שרימפס, קלמרי",["פרידה","מוליות"])],n:"⚠️ אסור לדוג בשמורת האלמוגים ובשמורות טבע"};
 const spin=O("🎯 ספינינג עם פיתיונות 2.7–3.3 מ'","ג'יגים 20–40 גרם, וובלרים, פופרים",["לוקוס","בלמידה","ברקודה"]),
  surf=O(wv>0.6?"🏖️ סרפקאסטינג 4–4.5 מ', משקולת 120–175 גרם":"🏖️ סרפקאסטינג קל 3.6–3.9 מ'","תולעת ים, סרדין, קלמרי",["מוסר ים","דניס","בורי"]),
  simple=O("🪝 חכה פשוטה / LRF ליד סלעים","שרימפס, בצק, תולעת ים",["סרגוס","דניס","בורי"]);
 if(s.t=="pier")return{o:wv>1.2?[surf,spin]:[spin,simple,surf]};
 if(s.t=="rock")return{o:[spin,simple]};
 return{o:wv>0.4?[surf,spin]:[simple,surf,spin]}}
const fmt=t=>t.slice(11,16),day=t=>new Date(t).toLocaleDateString('he-IL',{weekday:'short'});
async function rankAll(){const R=await Promise.all(SPOTS.map(s=>get(s).catch(()=>null)));
 const ok=R.filter(Boolean).map(r=>{const k=nowIdx(r.H),next=r.H.slice(k,k+6);return{...r,k,now:Math.round(next.reduce((a,h)=>a+h.score,0)/next.length)}}).sort((a,b)=>b.now-a.now);
 document.getElementById('rank').innerHTML=ok.map((r,i)=>{const h=r.H[r.k];return`<div class="spot" onclick="detail(SPOTS[${r.s.i}])"><div class="s ${cls(r.now)}">${r.now}</div><div class="n"><b>${["🥇","🥈","🥉"][i]||"🎣"} ${r.s.n}</b><div class="m">🌊 ${h.wave!=null?h.wave.toFixed(1)+"מ'":"-"} · 💨 ${Math.round(h.ws)} קמ"ש</div></div><div>‹</div></div>`}).join("")+"<small>הקישו על ספוט לניתוח מלא</small>"}
async function detail(s){const D=document.getElementById('det');D.innerHTML='<div class="card">טוען…</div>';const{H,sun}=await get(s),k=nowIdx(H),h=H[k];
 const win=H.slice(k,k+48),best=[...win].sort((a,b)=>b.score-a.score).slice(0,5).sort((a,b)=>a.t<b.t?-1:1),g=gear(s,h);
 D.innerHTML=`<div class="card"><div class="big">${s.n}</div><div class="big ${cls(h.score)}">${h.score}/100 – ${word(h.score)}</div>
 <div class="stats"><div>🌊 גלים<br><b>${h.wave!=null?h.wave.toFixed(1)+" מ'":"-"}</b></div><div>💨 רוח<br><b>${Math.round(h.ws)} קמ"ש</b><br><small>משבים ${Math.round(h.wg)} · מ${DIR(h.wd)}</small></div><div>🌡️ אוויר<br><b>${Math.round(h.temp)}°</b></div><div>💧 מים<br><b>${h.sst?h.sst.toFixed(0)+"°":"-"}</b></div><div>🌧️ גשם<br><b>${h.rain??0}%</b></div><div>🌅/🌇<br><b>${fmt(sun[0][0])} · ${fmt(sun[0][1])}</b></div></div></div>
 <div class="card"><div class="big">⏰ השעות הכי טובות</div><div class="chips">${best.map(b=>`<span class="${cls(b.score)}">${day(b.t)} ${fmt(b.t)} · ${b.score}</span>`).join("")}</div></div>
 <div class="card"><div class="big">👤 לפי רמת דייג</div><div class="chips">${levels(h).map(([n,o])=>`<span class="${o?"g":"r"}">${o?"✔":"✘"} ${n}</span>`).join("")}</div></div>
 <div class="card"><div class="big">🎣 ציוד מומלץ ודגים לפי סוג חכה</div>${g.n?g.n+"<br>":""}${g.o.map((o,i)=>`<div style="margin:12px 0;padding-top:8px;border-top:1px solid #fff2"><b>${i==0?"⭐ הכי מתאים עכשיו: ":""}${o.r}</b><br>🦐 פיתיון: ${o.b}<div class="fish" style="margin-top:8px">${o.f.map(fishImg).join("")}</div></div>`).join("")}</div>`;D.scrollIntoView({behavior:'smooth'})}
function geo(){navigator.geolocation.getCurrentPosition(p=>{const{latitude:a,longitude:b}=p.coords;const s=[...SPOTS].sort((x,y)=>Math.hypot(x.la-a,x.lo-b)-Math.hypot(y.la-a,y.lo-b))[0];detail({...s,n:s.n+" (הכי קרוב אליך)"})},()=>alert("אין גישה למיקום"))}
rankAll();
</script></body></html>
